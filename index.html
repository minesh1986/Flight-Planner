<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stansted Flight Planner · PMDG 737-800</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7EAEF; --card:#FFF; --ink:#101E38; --ink-soft:#55637C;
    --rule:#C9D0DA; --navy:#152A57; --yellow:#F5C518;
    --green:#1E7A44; --warn:#B23A2E; --fma:#5FE06A;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55}
  .wrap{max-width:780px;margin:0 auto;padding:0 16px 90px}

  header.mast{background:var(--navy);color:#fff;border-bottom:6px solid var(--yellow);
    position:sticky;top:0;z-index:20}
  .mast-inner{max-width:780px;margin:0 auto;padding:16px}
  .tail{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;
    color:var(--yellow);text-transform:uppercase}
  .routebar{display:flex;align-items:baseline;gap:10px;margin-top:4px}
  .routebar b{font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:clamp(26px,7vw,38px);line-height:1}
  .routebar .arw{color:var(--yellow);font-size:22px}
  .routebar .meta{margin-left:auto;font-family:"IBM Plex Mono",monospace;
    font-size:11px;color:#B9C6DE;text-align:right;line-height:1.5}

  .picker{background:var(--card);border:1px solid var(--rule);border-radius:4px;
    padding:14px;margin:18px 0}
  .picker .row{display:grid;grid-template-columns:1fr;gap:12px}
